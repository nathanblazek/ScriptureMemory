name: Android

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write # to publish the APK as a release

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ScriptureMemory-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      # A stable direct-download link for phones:
      # https://github.com/nathanblazek/ScriptureMemory/releases/download/android-latest/ScriptureMemory.apk
      - name: Publish APK
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ScriptureMemory.apk
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest ScriptureMemory.apk --prerelease --target "$GITHUB_SHA" \
            --title "Android app (latest build)" \
            --notes "Debug build of the Android app from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Open ScriptureMemory.apk on your phone to install."
